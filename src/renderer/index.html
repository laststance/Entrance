<!doctype html>
<html lang="ja" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- Own-renderer CSP: recorded content lives in the <webview> origin, never here (spec decision 21).
         ws:/localhost allowances exist for Vite dev HMR and local dev-server probing only. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: entrance:; font-src 'self' data:; connect-src 'self' ws: http://localhost:* http://127.0.0.1:* entrance:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entrance</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
